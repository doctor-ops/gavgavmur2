name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Укажите название вашей ветки (main или master)

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/tools/node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Папка, которую сгенерирует Vite
          branch: gh-pages # Ветка, куда запишутся готовые файлы сайта
