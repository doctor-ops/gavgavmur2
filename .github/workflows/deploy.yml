name: Deploy to Timeweb

on:
  push:
    branches:
      - main

# Задаче нужен только доступ на чтение репозитория.
permissions:
  contents: read

# Не запускать два деплоя одновременно.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          # Номер счётчика Яндекс Метрики: Settings → Secrets and variables → Actions → Variables
          VITE_YM_ID: ${{ vars.YM_ID }}

      - name: Sync files via FTP to Timeweb
        # Версии действий закреплены хешем коммита: подмена тега не подменит код.
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./gavgavmur/public_html/
