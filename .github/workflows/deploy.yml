name: Deploy to Timeweb

on:
  push:
    branches:
      - main # Убедитесь, что ваша основная ветка называется main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      # ИСПРАВЛЕНО: Вместо GitHub Pages отправляем файлы по FTP на Timeweb
      - name: Sync files via FTP to Timeweb
        uses: SamKirkland/FTP-Deploy-Action@4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/                  # Папка сборки Vite
          server-dir: ./gavgavmur/public_html/ # Точный путь к сайту на Timeweb
